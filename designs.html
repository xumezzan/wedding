<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <title>Варианты дизайна</title>
    <style>
      :root {
        color: #3d2b20;
        background: #fbf2e8;
        font-family: "Montserrat", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(ellipse at 12% 10%, rgba(210, 145, 112, 0.18), transparent 34rem),
          radial-gradient(ellipse at 88% 90%, rgba(137, 91, 49, 0.12), transparent 32rem),
          linear-gradient(180deg, #fff8f0 0%, #f7eadc 100%);
      }

      main {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 48px 0;
      }

      h1 {
        margin: 0 0 10px;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: clamp(42px, 8vw, 76px);
        font-weight: 500;
        line-height: 0.96;
      }

      .intro {
        max-width: 620px;
        margin: 0 0 34px;
        color: rgba(61, 43, 32, 0.68);
        font-size: 15px;
        line-height: 1.7;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .card {
        min-height: 420px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        overflow: hidden;
        border: 1px solid rgba(139, 99, 57, 0.18);
        border-radius: 8px;
        background: #fff7ee;
        box-shadow: 0 18px 48px rgba(70, 42, 24, 0.1);
      }

      .preview {
        flex: 1;
        min-height: 300px;
        background-position: center;
        background-size: cover;
      }

      .preview.gentle {
        background-image:
          radial-gradient(ellipse at center, rgba(255, 247, 236, 0.42), rgba(255, 247, 236, 0.08)),
          url("./assets/refined/hero-sakura-frame.png");
      }

      .preview.dark {
        background-image:
          radial-gradient(ellipse at 50% 22%, rgba(243, 229, 216, 0.2), transparent 38%),
          radial-gradient(ellipse at 18% 72%, rgba(201, 169, 142, 0.18), transparent 44%),
          linear-gradient(180deg, #14100e 0%, #211914 58%, #14100e 100%);
      }

      .body {
        padding: 22px;
        background: rgba(255, 250, 244, 0.94);
        border-top: 1px solid rgba(139, 99, 57, 0.14);
      }

      .card h2 {
        margin: 0 0 6px;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: 34px;
        font-weight: 500;
      }

      .card p {
        min-height: 44px;
        margin: 0 0 18px;
        color: rgba(61, 43, 32, 0.66);
        font-size: 13px;
        line-height: 1.7;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        border: 1px solid rgba(122, 82, 39, 0.24);
        border-radius: 4px;
        color: #fffaf4;
        background: #7a5227;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.22em;
        text-decoration: none;
        text-transform: uppercase;
      }

      @media (max-width: 760px) {
        main {
          width: min(100% - 22px, 480px);
          padding: 28px 0;
        }

        .grid {
          grid-template-columns: 1fr;
        }

        .card {
          min-height: 360px;
        }

        .preview {
          min-height: 230px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Варианты дизайна</h1>
      <p class="intro">Две версии одного приглашения для показа клиенту: текущая нежная и более тёплая тёмная.</p>

      <div class="grid">
        <article class="card">
          <div class="preview gentle"></div>
          <div class="body">
            <h2>Нежный</h2>
            <p>Текущий светлый вариант с розовой сакурой и мягкой свадебной палитрой.</p>
            <a href="./index.html">Открыть</a>
          </div>
        </article>

        <article class="card">
          <div class="preview dark"></div>
          <div class="body">
            <h2>Moonlight</h2>
            <p>Тёмный luxury-вариант: шампань, ivory, светлый кофе и мягкое бронзовое свечение.</p>
            <a href="./darker.html">Открыть</a>
          </div>
        </article>
      </div>
    </main>
  </body>
</html>
